<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta property="og:title" content="Арайлым қыз ұзату!">
<meta property="og:description" content="30.10.2026">
<title>Арайлым қыз ұзату!</title>

<link href="https://fonts.googleapis.com/css2?family=Piazzolla:wght@100;300;400;600&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Piazzolla', serif;
    overflow-x: hidden;
  }
  img, video {
    display: block;
    width: 100%;
    height: auto;
  }
  a {
    display: block;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('fon.jpg');
    background-size: cover;
    background-position: center center;
    z-index: -1;
  }

  /* Видеолардың пайда болу анимациясы */
  .element-animation {
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .element-animation.element-show {
    opacity: 1;
  }

  .arrow-container {
    display: flex;
    justify-content: center;
    margin: 20px 0;
  }
  .arrow-container img {
    width: 100px;
    height: auto;
  }

  /* МУЗЫКА БАСҚАРУ ТҮЙМЕСІ */
  .music-toggle-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 0;
  }
  .music-toggle-btn {
    background: transparent;
    border: 1px solid #3c5a1c;
    color: #3c5a1c;
    border-radius: 30px;
    padding: 12px 32px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: 0.3s;
    white-space: nowrap;
  }
  .music-toggle-btn:hover {
    background: #3c5a1c;
    color: #ffffff;
  }

  /* ТАЙМЕР (жасыл, дербес) */
  .timer-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 30px;
  }
  .countdown-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px 20px;
    padding: 10px 20px;
  }
  .countdown-item {
    text-align: center;
    display: inline-block;
    min-width: 40px;
  }
  .countdown-item .number {
    display: block;
    font-size: clamp(2.2rem, 8vw, 3.5rem);
    font-weight: 300;
    color: #3c5a1c;
    letter-spacing: 2px;
    line-height: 1;
  }
  .countdown-item .label {
    display: block;
    font-size: clamp(0.6rem, 1.5vw, 0.9rem);
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #3c5a1c;
    margin-top: 4px;
    font-weight: 300;
  }
  .countdown-divider {
    font-size: clamp(1.5rem, 5vw, 3rem);
    font-weight: 100;
    color: #3c5a1c;
    padding-top: 5px;
    display: inline-block;
  }

  /* ТАЙМЕР video5-тің үстінде, ақ түсті, дәл ортасында */
  .video-timer-overlay {
    position: relative;
    width: 100%;
  }
  .video-timer-overlay video {
    display: block;
    width: 100%;
    height: auto;
  }
  .video-timer-overlay .timer-wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    margin-top: 0;
    width: 100%;
  }
  .video-timer-overlay .countdown-item .number,
  .video-timer-overlay .countdown-item .label,
  .video-timer-overlay .countdown-divider {
    color: #ffffff;
  }

  /* ФОРМА */
  .form-wrapper {
    padding: 10px 15px 30px;
  }
  .form-container {
    max-width: 450px;
    margin: 0 auto;
  }
  .form-inner {
    text-align: center;
  }
  .radio-group {
    text-align: left;
    margin-bottom: 14px;
  }
  .radio-group label {
    font-weight: 300;
    margin-left: 4px;
    color: #3c5a1c;
    font-size: 1rem;
  }
  .radio-group input[type="radio"] {
    margin-right: 4px;
    accent-color: #3c5a1c;
    width: 15px;
    height: 15px;
  }
  .form-inner textarea {
    width: 100%;
    border: none;
    border-bottom: 1px solid #3c5a1c;
    border-radius: 0;
    padding: 8px 4px 4px;
    font-size: 0.95rem;
    background: transparent;
    resize: vertical;
    min-height: 40px;
    font-family: inherit;
    color: #3c5a1c;
    outline: none;
    transition: border-color 0.3s;
  }
  .form-inner textarea:focus {
    border-bottom-color: #3c5a1c;
  }
  .form-inner textarea::placeholder {
    color: #6f8a53;
    font-weight: 200;
  }
  .btn-submit {
    background: transparent;
    color: #3c5a1c;
    border: 1px solid #3c5a1c;
    border-radius: 30px;
    padding: 10px 30px;
    font-size: 0.95rem;
    font-weight: 300;
    letter-spacing: 2px;
    width: 100%;
    transition: 0.3s;
    margin-top: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-submit:hover {
    background: #3c5a1c;
    color: #ffffff;
  }
</style>
</head>
<body>

<!-- АУДИО -->
<audio id="backgroundMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
  Ваш браузер не поддерживает воспроизведение музыки.
</audio>

<!-- ВИДЕО 1 -->
<div class="element-animation">
  <video src="photo1.mp4" muted playsinline></video>
</div>

<!-- МУЗЫКА БАСҚАРУ ТҮЙМЕСІ (photo1.mp4 мен photo2.mp4 арасында, дербес орны бар) -->
<div class="music-toggle-wrapper">
  <button id="musicToggleBtn" class="music-toggle-btn" type="button" aria-label="Музыканы қосу/өшіру">
    <span id="musicBtnText">Әуенді қосу</span>
  </button>
</div>

<!-- ВИДЕО 2 -->
<div class="element-animation">
  <video src="photo2.mp4" muted playsinline></video>
</div>

<!-- ВИДЕО 3 -->
<div class="element-animation">
  <video src="photo3.mp4" muted playsinline></video>
</div>

<!-- ВИДЕО 4 (2ГИС сілтемесі) -->
<div class="element-animation">
  <a href="https://go.2gis.com/Vrkum" target="_blank">
    <video src="photo4.mp4" muted playsinline></video>
  </a>
</div>

<!-- ВИДЕО 5 + ТАЙМЕР (ақ түсті, дәл ортасында) -->
<div class="element-animation video-timer-overlay">
  <video src="photo5.mp4" muted playsinline></video>
  <div class="timer-wrapper">
    <div class="countdown-container">
      <div class="countdown-item">
        <span class="number" id="days">00</span>
        <span class="label">Күн</span>
      </div>
      <span class="countdown-divider">:</span>
      <div class="countdown-item">
        <span class="number" id="hours">00</span>
        <span class="label">Сағат</span>
      </div>
      <span class="countdown-divider">:</span>
      <div class="countdown-item">
        <span class="number" id="minutes">00</span>
        <span class="label">Минут</span>
      </div>
      <span class="countdown-divider">:</span>
      <div class="countdown-item">
        <span class="number" id="seconds">00</span>
        <span class="label">Секунд</span>
      </div>
    </div>
  </div>
</div>

<!-- ВИДЕО 6 -->
<div class="element-animation">
  <video src="photo6.mp4" muted playsinline></video>
</div>

<!-- ВИДЕО 7 -->
<div class="element-animation">
  <video src="photo7.mp4" muted playsinline></video>
</div>

<!-- ОПРОС (photo7.mp4-тен кейін) -->
<div class="form-wrapper">
  <div class="form-container">
    <form id="form">
      <div class="form-inner">
        <div class="radio-group">
          <p style="font-weight:300; margin-bottom:6px; color:#3c5a1c;">Есіміңізді жазыңыз</p>
          <textarea required name="message" maxlength="100" id="message" rows="2" placeholder="Есіміңіз"></textarea>
        </div>

        <div class="radio-group">
          <p style="font-weight:300; margin-bottom:6px; color:#3c5a1c;">Тойға барасыз ба?</p>
          <input type="radio" id="q_yes" name="attend" value="Барамын" required>
          <label for="q_yes">Барамын</label><br>
          <input type="radio" id="q_no" name="attend" value="Бара алмаймын">
          <label for="q_no">Бара алмаймын</label>
        </div>

        <div class="radio-group">
          <p style="font-weight:300; margin-bottom:6px; color:#3c5a1c;">Неше адам болып келесіздер?</p>
          <div style="display:flex; align-items:center; gap:14px; justify-content:center;">
            <button type="button" id="decrease" style="background:none; border:1px solid #3c5a1c; color:#3c5a1c; border-radius:50%; width:34px; height:34px; font-size:1.3rem; cursor:pointer;">−</button>
            <span id="peopleCount" style="font-size:1.3rem; min-width:24px; text-align:center; color:#3c5a1c;">1</span>
            <button type="button" id="increase" style="background:none; border:1px solid #3c5a1c; color:#3c5a1c; border-radius:50%; width:34px; height:34px; font-size:1.3rem; cursor:pointer;">+</button>
          </div>
          <input type="hidden" name="choice" id="choiceHidden" value="1">
        </div>

        <button type="submit" class="btn-submit">Жіберу</button>
      </div>
    </form>
  </div>
</div>

<!-- ВИДЕО 8 (Instagram сілтемесі) -->
<div class="element-animation">
  <a href="https://www.instagram.com/toiga_shaqyrtugo/" target="_blank">
    <video src="photo8.mp4" muted playsinline></video>
  </a>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const audio = document.getElementById('backgroundMusic');
    const musicBtn = document.getElementById('musicToggleBtn');
    const musicBtnText = document.getElementById('musicBtnText');
    let isPlaying = false;

    musicBtn.addEventListener('click', function () {
      if (!isPlaying) {
        audio.play().catch(function (err) {
          console.warn('Не удалось запустить музыку:', err);
        });
        musicBtnText.textContent = 'Әуенді өшіру';
        isPlaying = true;
      } else {
        audio.pause();
        musicBtnText.textContent = 'Әуенді қосу';
        isPlaying = false;
      }
    });

    // Видеолардың бірте-бірте пайда болуы + көру аймағына кіргенде бір рет ойнау
    const observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('element-show');

          const video = entry.target.querySelector('video');
          if (video) {
            video.currentTime = 0;
            video.play().catch(function (err) {
              console.warn('Видео ойнатылмады:', err);
            });
          }

          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.4 });
    document.querySelectorAll('.element-animation').forEach(function (el) {
      observer.observe(el);
    });

    // ТАЙМЕР
    function updateCountdown() {
      const endDate = new Date("October 30, 2026 18:00:00").getTime();
      const now = Date.now();
      const distance = endDate - now;

      if (distance < 0) {
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = String(days).padStart(2, '0');
      document.getElementById("hours").textContent = String(hours).padStart(2, '0');
      document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
      document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // СЧЁТЧИК КОЛИЧЕСТВА
    let count = 1;
    const peopleCountEl = document.getElementById('peopleCount');
    const choiceHiddenEl = document.getElementById('choiceHidden');
    document.getElementById('decrease').addEventListener('click', function () {
      if (count > 1) {
        count--;
        peopleCountEl.textContent = count;
        choiceHiddenEl.value = count;
      }
    });
    document.getElementById('increase').addEventListener('click', function () {
      count++;
      peopleCountEl.textContent = count;
      choiceHiddenEl.value = count;
    });

    // ФОРМА
    const URL_APP = "https://script.google.com/macros/s/AKfycbxnZ94mNxsEZ7A8DhFGAMUTJowPXZ9CS15hHRkJWKY6Y7hVF8l4tr6qzpqgOxjRjpcgIg/exec";
    const form = document.querySelector("#form");

    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();

      const message = document.querySelector("[name=message]");
      const attend = document.querySelector("[name=attend]:checked");
      const choice = document.querySelector("[name=choice]");

      const details = {
        name: message.value.trim(),
        choice: choice ? choice.value : '',
        message: attend ? attend.value : '',
      };

      if (URL_APP) {
        fetch(URL_APP, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          mode: "no-cors",
          body: JSON.stringify(details)
        });
      }

      if (attend) attend.checked = false;
      message.value = '';
      count = 1;
      peopleCountEl.textContent = count;
      choiceHiddenEl.value = count;
      alert('Жауабыңызға рахмет!');
    });
  });
</script>

</body>
</html>
